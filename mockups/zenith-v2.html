<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenith IDE Mockup v2</title>
</head>
<body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: scene switcher above one IDE window. Islands geometry, Driftwood colours (zed-config default profile), Atom Material icons.
   Identity rule: blue = the IDE, orange = agents. Orange appears only where an agent is involved. */
:root{
  --backdrop:#131416; --bg0:#2b2d30; --bg1:#2b2d30; --bg2:#282c34; --bg3:#31343a; --edge:#1e1f22;
  --line:#393b40; --line2:#3b4048; --hover:rgba(255,255,255,.08); --sel:#2a4371; --tab-on:#233558;
  --fg:#dfe1e5; --fg-dim:#b4b7be; --fg-mute:#8c8f96; --code:#abb2bf; --lnum:#495162; --curline:#2c313c;
  --accent:#538af9; --accent2:#71a1fe; --btn:#3574f0;
  --agent:#ff7a3d; --agent-dim:rgba(255,122,61,.14); --agent-line:rgba(255,122,61,.10);
  --ok:#6db083; --ok-bg:#203b2a; --warn:#ff8c00; --warn-bg:#44321d; --err:#f44747; --err-bg:rgba(244,71,71,.12);
  --add-bg:#2d4134; --del-bg:rgba(224,108,117,.14); --exec:#2d3f60; --inlay-bg:#363c44;
  --vc-mod:#80cbc4; --vc-add:#c3e887;
  --k:#c88da2; --f:#4fb3be; --fb:#61afef; --s:#98c379; --v:#ffb98b; --vb:#d4886a; --c:#6b7280; --n:#d19a66; --t:#649fc4; --ns:#63b7c0; --pr:#34848d;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--backdrop);color:var(--fg);font:13px/1.4 var(--ui);display:grid;grid-template-rows:auto minmax(0,1fr);grid-template-columns:minmax(0,1fr);gap:12px;
  padding-block:14px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.ic{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.fi{width:16px;height:16px;flex:none}
.mono{font-family:var(--mono)} .tnum{font-variant-numeric:tabular-nums} .mute{color:var(--fg-mute)}

/* scene bar */
.scenes{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.seg{display:inline-flex;background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;color:var(--fg-dim);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--fg)}
.seg button[data-scene="review"][aria-pressed="true"]{background:var(--agent-dim);color:var(--agent)}
.scene-note{color:var(--fg-mute);font-size:12.5px;min-width:0;flex:1 1 280px}

/* window */
.app{min-height:540px;display:grid;grid-template-rows:42px minmax(0,1fr) 26px;background:var(--bg0);border:1px solid var(--edge);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55)}
.tb{display:flex;align-items:center;gap:4px;padding:0 10px;min-width:0;position:relative}
.lights{display:flex;gap:7px;margin-right:10px}.lights i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.w{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 8px;border-radius:6px;white-space:nowrap}
.w:hover,.ib:hover{background:var(--hover)}
.w .chev{width:12px;height:12px;color:var(--fg-mute)}
.proj-badge{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font:600 10px var(--ui);color:#fff;background:#4a5b8c}
.spacer{flex:1;min-width:8px}
.ib{width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--fg-dim)}
.ib.play{color:var(--ok)} .ib.dbg{color:var(--ok)} .ib.on{background:var(--ok-bg)} .ib.stop{color:var(--err)}
.search-btn{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 10px;border-radius:7px;background:var(--bg3);color:var(--fg-mute);width:min(340px,30vw)}
.search-btn:hover{color:var(--fg-dim)}
.search-btn kbd{margin-left:auto}
kbd{font:500 10.5px var(--mono);color:var(--fg-mute);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.runcfg{color:var(--fg)}
.agent-chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:14px;background:var(--agent-dim);color:var(--agent);font-weight:500;white-space:nowrap}
.agent-chip:hover{background:rgba(255,122,61,.22)}
.agent-chip .ic{width:14px;height:14px}
.agent-chip .cnt{background:var(--agent);color:#1e1f22;border-radius:8px;padding:0 6px;font-size:11px;font-weight:600}
.pop{position:absolute;top:40px;right:44px;z-index:30;width:min(360px,calc(100vw - 48px));background:var(--bg0);border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.5);padding:6px 0}
.pop h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);margin:6px 12px}
.pop .foot{display:flex;gap:6px;padding:8px 12px 4px;border-top:1px solid var(--line);margin-top:4px}

/* main */
.main{display:grid;grid-template-columns:40px auto minmax(0,1fr) auto 40px;gap:5px;min-height:0;position:relative}
.stripe{display:flex;flex-direction:column;gap:2px;align-items:center;padding:6px 0}
.stripe .gap{flex:1}
.sb{position:relative;width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--fg-dim)}
.sb .ic{width:17px;height:17px}
.sb:hover{background:var(--hover);color:var(--fg)}
.sb[aria-pressed="true"]{background:var(--sel);color:var(--fg)}
.sb.agent{color:var(--agent)} .sb.agent[aria-pressed="true"]{background:var(--agent-dim)}
.sb .dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--agent);border:1.5px solid var(--bg0)}
.panel{width:280px;background:var(--bg1);display:flex;flex-direction:column;min-height:0;min-width:0;border-radius:10px;box-shadow:0 0 0 1px var(--edge);overflow:hidden}
.panel.r{width:330px}
.ph{display:flex;align-items:center;gap:6px;height:36px;padding:0 6px 0 12px;flex:none}
.ph h2{font-size:12.5px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .ib{width:24px;height:24px}
.pb{overflow:auto;flex:1;min-height:0;padding:2px 0 12px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);padding:10px 12px 4px}
.row{display:flex;align-items:center;gap:7px;padding:0 10px;min-height:24px;white-space:nowrap;cursor:default;border-radius:0}
.row:hover{background:var(--hover)} .row.on{background:var(--sel)} .row.link{cursor:pointer}
.row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:11.5px;color:var(--fg-mute)}
.tw{width:12px;height:12px;color:var(--fg-mute);flex:none}
.st-M{color:var(--vc-mod)} .st-A{color:var(--vc-add)} .st-G{color:var(--agent)}
.st{font:500 11px var(--mono);width:12px;text-align:center}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
.btn{height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--line);font-size:12px;font-weight:500;background:var(--bg0);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--fg-mute)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.agent{background:var(--agent);border-color:var(--agent);color:#1e1f22}
.btn.ghost-ok{color:var(--ok)} .btn.ghost-bad{color:var(--err)}
.btn .ic{width:13px;height:13px}
textarea.commit{display:block;width:calc(100% - 24px);margin:6px 12px;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--fg);font:12px/1.5 var(--ui);padding:6px 8px}
.chk{display:flex;align-items:center;gap:6px;padding:2px 12px;font-size:12px;color:var(--fg-dim)} .chk input{accent-color:var(--accent);margin:0}
.tl{display:grid;grid-template-columns:44px 12px minmax(0,1fr);gap:0 8px;align-items:start;padding:5px 12px}
.tl:hover{background:var(--hover)}
.tl .when{font:11.5px var(--mono);color:var(--fg-mute);padding-top:1px}
.tl .node{width:9px;height:9px;border-radius:50%;margin-top:4px;border:2px solid var(--fg-mute)} .tl .node.agent{border-color:var(--agent);background:var(--agent)} .tl .node.label{border-color:var(--accent)}
.tl small{display:block;color:var(--fg-mute);font-size:11px}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.agent{background:var(--agent-dim);color:var(--agent)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.mute{background:var(--bg3);color:var(--fg-dim)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.run{background:rgba(97,175,239,.14);color:#61afef}
.agent-row{padding:8px 12px}
.agent-row:hover{background:var(--hover)}
.agent-top{display:flex;align-items:center;gap:8px}
.agent-top b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--fg-mute);margin:2px 0 0 17px}
.sdot{width:9px;height:9px;border-radius:50%;flex:none}
.sdot.run{background:#61afef;animation:pulse 1.6s ease-in-out infinite} .sdot.wait{background:var(--agent)} .sdot.done{background:var(--ok)}
@keyframes pulse{50%{opacity:.35}}

/* center */
.center{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:5px;min-width:0;min-height:0}
.island{background:var(--bg2);border-radius:10px;box-shadow:0 0 0 1px var(--edge);overflow:hidden;min-height:0;min-width:0}
.ed{display:grid;grid-template-rows:36px minmax(0,1fr)}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line2);overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 12px;white-space:nowrap;color:var(--fg-dim);font-size:12.5px;position:relative;cursor:pointer}
.tab:hover{color:var(--fg);background:var(--hover)}
.tab.on{background:var(--tab-on);color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tab.agent-tab{color:var(--agent)} .tab.agent-tab.on{background:var(--agent-dim)} .tab.agent-tab.on::after{background:var(--agent)}
.tab .x{width:12px;height:12px;opacity:0;color:var(--fg-mute)} .tab:hover .x{opacity:1}
.tab .adot{width:7px;height:7px;border-radius:50%;background:var(--agent)}
.view{display:grid;grid-template-rows:28px minmax(0,1fr);min-height:0}
.crumbs{display:flex;align-items:center;gap:4px;padding:0 14px;font-size:12px;color:var(--fg-mute);white-space:nowrap;overflow:hidden}
.crumbs .ic{width:11px;height:11px} .crumbs b{font-weight:500;color:var(--fg-dim)}
.edwrap{position:relative;min-height:0;min-width:0}
.editor{position:absolute;inset:0 78px 0 0;overflow:auto;font:13.5px/24px var(--mono);color:var(--code);padding:4px 0 40px;tab-size:4}
.ln{display:grid;grid-template-columns:50px 24px max-content;min-width:100%;white-space:pre}
.ln .num{color:var(--lnum);text-align:right;user-select:none;font-variant-numeric:tabular-nums}
.ln .mk{display:grid;place-items:center}
.ln .code{padding-right:28px}
.ln.cur{background:var(--curline)} .ln.cur .num{color:var(--fg-mute)}
.ln.exec{background:var(--exec)} .ln.exec .num{color:var(--accent2)}
.ln.agent{background:var(--agent-line)} .ln.agent .num{box-shadow:inset -2px 0 var(--agent)}
.ln.lens{font:12px/26px var(--ui);color:var(--fg-mute)}
.ln.lens .code{display:flex;align-items:center;gap:10px}
.ln.lens .who{color:var(--agent);font-weight:500;display:inline-flex;align-items:center;gap:5px}
.ln.lens a{color:var(--fg-dim);cursor:pointer} .ln.lens a:hover{color:var(--agent)}
.mk .ic{width:13px;height:13px} .mk .hk{color:#d19a66;cursor:pointer} .mk .runm{color:var(--ok);cursor:pointer}
.bp{width:11px;height:11px;border-radius:50%;background:#db5c5c}
.ig{display:inline-block;width:4ch;height:24px;vertical-align:top;box-shadow:inset 1px 0 #3b4048}
.ln.cur .ig,.ln.exec .ig,.ln.agent .ig{box-shadow:inset 1px 0 #4a505a}
.b0{color:#d8b860}.b1{color:#6cb463}.b2{color:#50a8ff}.b3{color:#e2a5b8}
.k{color:var(--k);font-style:italic} .f{color:var(--f)} .fb{color:var(--fb)} .s{color:var(--s)} .v{color:var(--v)} .vb{color:var(--vb)} .c{color:var(--c)} .n,.C{color:var(--n)} .t{color:var(--t)} .ns{color:var(--ns)} .pr{color:var(--pr);font-style:italic}
.hook{text-decoration:underline dotted #d19a66;text-underline-offset:4px;cursor:pointer}
.inlay{font:500 10.5px/16px var(--ui);padding:0 5px;border-radius:4px;background:var(--inlay-bg);color:#7f8794;margin-right:4px;display:inline-block;vertical-align:1px}
.ival{margin-left:22px;color:var(--fg-mute);font-style:italic;font-size:12px}
.dg{margin-left:22px;font:11.5px var(--ui);color:var(--warn);background:var(--warn-bg);padding:1px 7px;border-radius:4px}
.wv{text-decoration:underline wavy var(--warn);text-underline-offset:4px;text-decoration-thickness:1px}
.minimap{position:absolute;top:0;right:0;bottom:0;width:78px;padding:8px 8px 0 10px;box-shadow:inset 1px 0 #2f333b;overflow:hidden}
.minimap i{display:block;height:2px;margin-bottom:2px;border-radius:1px;background:#5c6370;opacity:.55}
.minimap i.x{background:var(--warn);opacity:.9} .minimap i.a{background:var(--agent);opacity:.9} .minimap i.e{background:var(--accent);opacity:.9}
.minimap .vp{position:absolute;left:0;right:0;top:4px;height:110px;background:rgba(255,255,255,.05)}
.hover{position:absolute;z-index:20;width:min(380px,calc(100% - 24px));background:var(--bg0);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.45);font-size:12px}
.hover header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line)}
.hover header b{font:500 12.5px var(--mono)}
.hover .row{padding:3px 10px}
.hover footer{padding:6px 10px;color:var(--fg-mute);font-size:11px;border-top:1px solid var(--line)}

/* review item */
.review{overflow:auto;padding:16px 18px 40px;display:grid;gap:14px;align-content:start}
.rv-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.rv-head h2{margin:0;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.rv-head h2 .ic{color:var(--agent);width:18px;height:18px}
.rv-head p{margin:4px 0 0;color:var(--fg-mute);font-size:12.5px}
.rv-head .btns{margin-left:auto;padding:0}
.rv-file{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg2)}
.rv-fh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg3)}
.rv-fh b{font-weight:500}
.diff{font:12.5px/22px var(--mono);overflow-x:auto;color:var(--code)}
.diff div{white-space:pre;padding:0 12px 0 0;display:grid;grid-template-columns:40px 18px max-content;min-width:100%}
.diff .dn{color:var(--lnum);text-align:right;padding-right:6px;user-select:none}
.diff .a{background:var(--add-bg)} .diff .a .sg{color:var(--vc-add)}
.diff .d{background:var(--del-bg)} .diff .d .sg{color:#e06c75}
.diff .hh{color:var(--fg-mute);font-family:var(--ui);font-size:12px;background:rgba(255,255,255,.02)}
.hunk-act{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--line)}
.done-note{display:flex;align-items:center;gap:8px;padding:10px 12px;color:var(--ok);font-size:12.5px}
.merge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:8px;border:1px solid rgba(255,122,61,.35);background:var(--agent-line)}

/* bottom */
.bottom{height:220px;display:grid;grid-template-rows:34px minmax(0,1fr);background:var(--bg1)}
.btabs{display:flex;align-items:center;gap:2px;padding:0 6px;overflow-x:auto;scrollbar-width:none}
.bt{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;color:var(--fg-dim);font-size:12px;white-space:nowrap}
.bt:hover{background:var(--hover);color:var(--fg)} .bt[aria-selected="true"]{background:var(--sel);color:var(--fg)}
.bt .ic{width:13px;height:13px}
.bbody{overflow:auto;min-height:0}
.dbg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));min-height:100%}
.dbg>div{border-right:1px solid var(--line);min-width:0;overflow:auto} .dbg>div:last-child{border-right:0}
.dbgbar{display:inline-flex;gap:2px;margin-left:auto}
.dbgbar .ib{width:24px;height:24px}
.secrow{display:flex;align-items:center;padding:6px 12px 2px;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute)}
.frame,.var{display:flex;gap:6px;padding:3px 12px;font:12px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame:hover,.var:hover{background:var(--hover)} .frame.on{background:var(--sel)}
.frame span:first-child{overflow:hidden;text-overflow:ellipsis} .frame span:last-child{color:var(--fg-mute);margin-left:auto;padding-left:10px}
.var .vn{color:var(--v)} .var .vt{color:var(--fg-mute)} .var .vv{color:var(--s)} .var .vi{color:var(--n)}
.term{font:12px/19px var(--mono);padding:8px 14px;white-space:pre;color:var(--fg-dim)}
.term .p{color:var(--ok)} .term .h{color:var(--fg)} .term .e{color:var(--err)} .term .o{color:var(--ok)} .term .w{color:var(--warn)}
.prob{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 14px;font-size:12px}
.prob:hover{background:var(--hover)} .prob .src{color:var(--fg-mute);font-size:11px}
.progress{height:2px;background:var(--line);margin:0 14px}.progress i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}

/* status */
.status{display:flex;align-items:center;gap:2px;padding:0 8px;font-size:11.5px;color:var(--fg-dim);white-space:nowrap;overflow:hidden;min-width:0}
.si{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 6px;border-radius:4px}
.si:hover{background:var(--hover);color:var(--fg)} .si .ic{width:12px;height:12px}
.si.warn{color:var(--warn)} .si.ok{color:var(--ok)} .si.dbg{color:var(--accent2)} .si.agent{color:var(--agent)}

/* search everywhere */
.scrim{position:fixed;inset:0;background:rgba(5,5,8,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(80px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.se{width:min(640px,100%);background:var(--bg0);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
.se-tabs{display:flex;gap:2px;padding:8px 8px 0;overflow-x:auto;scrollbar-width:none}
.se-tabs button{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:var(--fg-dim);white-space:nowrap}
.se-tabs button[aria-selected="true"]{background:var(--sel);color:var(--fg)}
.se-in{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.se-in input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:14px var(--ui)}
.se-list{max-height:min(380px,55vh);overflow:auto;padding:4px 0}
.se-item{display:flex;align-items:center;gap:10px;padding:6px 14px;cursor:pointer}
.se-item:hover,.se-item.on{background:var(--sel)}
.se-item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.se-item .kind{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-mute)}

@media (max-width: 1100px){ .hide-l{display:none!important} .search-btn{width:auto} .search-btn .lbl{display:none} }
@media (max-width: 900px){
  .panel{position:absolute;top:0;bottom:0;z-index:10;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .panel.l{left:45px;width:min(280px,calc(100% - 90px))} .panel.r{right:45px;width:min(330px,calc(100% - 90px))}
  .hide-m{display:none!important} .minimap{display:none} .editor{right:0} .bottom{height:170px}
}
@media (max-width: 560px){ .hide-s{display:none!important} .tb{gap:2px;padding:0 6px} .lights{margin-right:4px} .agent-chip .lbl{display:none} }
@media (prefers-reduced-motion: reduce){ .sdot.run{animation:none} .progress i{transition:none} }

const RX=new RegExp(String.raw`(\/\*\*.*|^\s*\*.*|\/\/.*)|('[^']*')|(\$\w+)|\b(${KW})\b|\b([A-Z][A-Z0-9_]{2,})\b|(\\?(?:[A-Z]\w*\\)+[A-Z]\w*|\\?\b[A-Z]\w*[a-z]\w*\b)|\b(\w+)(?=\s*\()|\b(\d+)\b`,'g');
function hl(src){
  if(src.startsWith('<?php')) return '<span class="k">&lt;?php</span>';
  return esc(src).replace(RX,(m,c,s,v,k,C,t,f,n)=>{
    if(c) return `<span class="c">${m}</span>`;
    if(s){const h=s.slice(1,-1);return HOOKS[h]?`<span class="s hook" data-hook="${h}" tabindex="0">${m}</span>`:`<span class="s">${m}</span>`;}
    if(v) return `<span class="${m==='$this'?'vb':'v'}">${m}</span>`;
    if(k) return `<span class="k">${m}</span>`;
    if(C) return `<span class="C">${m}</span>`;
    if(t) return `<span class="${m.includes('\\')&&!m.startsWith('\\')?'ns':'t'}">${m}</span>`;
    if(f) return `<span class="fb">${m}</span>`;
    return `<span class="n">${m}</span>`;
  }).replace(/(<span class="k">function<\/span> )<span class="fb">/g,'$1<span class="f">')
    .replace(/-&gt;(\w+)(?!\w|<|\s*\()/g,'-&gt;<span class="pr">$1</span>')

}
let bd=0;
function line(src){
  const tabs=src.match(/^\t*/)[0].length;
  let inStr=false;
  const html=hl(src.slice(tabs)).split(/(<[^>]+>)/).map(p=>{
    if(p.startsWith('<span class="s')){inStr=true;return p}
    if(p==='</span>'){inStr=false;return p}
    if(p.startsWith('<')||inStr) return p;
    return p.replace(/[()[\]{}]/g,ch=>'([{'.includes(ch)?`<span class="b${(bd++)%4}">${ch}</span>`:(bd=Math.max(0,bd-1),`<span class="b${bd%4}">${ch}</span>`));
  }).join('');
  return Array.from({length:tabs},()=>'<span class="ig"></span>').join('')+html;
}

/* ---------- editor view ---------- */
function editorView(name){
  const f=FILES[name]; bd=0; let out='';
  f.lines.forEach(([src,m={}],i)=>{
    const n=i+1, showAgent=m.agent&&!decided.h1;
    if(m.lens&&showAgent) out+=`<div class="ln lens"><span></span><span></span><span class="code">${'\t\t'.replace(/\t/g,'<span class="ig"></span>')}<span class="who">${ic('bot')} Claude Code · agent/rest-nonce</span><span>added a nonce check</span><a data-hunk="h1" data-v="ok">Accept</a><a data-hunk="h1" data-v="no">Reject</a><a data-scene-go="review">Review all</a></span></div>`;
    let mk='';
    if(m.bp&&state.debug) mk='<span class="bp" title="Breakpoint"></span>';
    else if(m.g==='hook') mk=`<span class="hk" data-hook="${m.h}" tabindex="0" title="Hook listeners">${ic('hook')}</span>`;
    else if(m.g==='run') mk=`<span class="runm" title="Run test" data-run="1">${ic('play','fill')}</span>`;
    const cls=['ln',state.debug&&m.exec?'exec':(!state.debug&&n===f.cur?'cur':''),showAgent?'agent':''].filter(Boolean).join(' ');
    let code=line(src);
    if(m.iv&&state.debug) code+=`<span class="ival">${esc(m.iv)}</span>`;
    if(m.dg&&!state.debug) code+=`<span class="dg">⚠ ${esc(m.dg)}</span>`;
    out+=`<div class="${cls}"><span class="num">${n}</span><span class="mk">${mk}</span><span class="code">${code}</span></div>`;
  });
  const mini=f.lines.map(([s,m={}])=>{const ind=(s.match(/^\t*/)[0].length)*3.6,len=s.replace(/^\t*/,'').length;
    const c=m.agent&&!decided.h1?'a':(m.exec&&state.debug?'e':(m.dg&&!state.debug?'x':''));
    return `<i class="${c}" style="margin-left:${ind}px;width:${Math.min(len*.55,58-ind)}px"></i>`}).join('');
  const crumbs=['lumen-gallery',...f.path].join(ic('right'))+ic('right')+f.sym.map((s,i)=>i===f.sym.length-1?`<b>${s}</b>`:s).join(ic('right'));
  return `<div class="view"><div class="crumbs">${crumbs}</div><div class="edwrap"><div class="editor" id="editor" aria-label="Editor: ${name}">${out}</div><div class="minimap" aria-hidden="true"><div class="vp"></div>${mini}</div><div class="hover" id="hover" hidden></div></div></div>`;
}

/* ---------- review view ---------- */
function reviewView(){
  const a=AGENTS[0];
  const files=HUNKS.map(h=>{
    const st=decided[h.id];
    const rows=h.rows.map(([sg,n,src])=>`<div class="${sg==='+'?'a':sg==='-'?'d':''}"><span class="dn">${n}</span><span class="sg">${sg.trim()}</span><span>${line(src)}</span></div>`).join('');
    return `<div class="rv-file"><div class="rv-fh">${fi(h.icon)}<b>${h.file}</b><span class="mute" style="font-size:12px">${h.path}</span><span style="margin-left:auto" class="st-A mono">${h.stat}</span></div>
      ${st?`<div class="done-note">${ic(st==='ok'?'check':'x')} ${st==='ok'?'Accepted':'Rejected'} · <a data-undo="${h.id}" style="color:var(--fg-dim);cursor:pointer">Undo</a></div>`:
      `<div class="diff"><div class="hh"><span></span><span></span><span>${h.head}</span></div>${rows}</div>
      <div class="hunk-act"><button class="btn ghost-ok" data-hunk="${h.id}" data-v="ok">${ic('check')}Accept</button><button class="btn ghost-bad" data-hunk="${h.id}" data-v="no">${ic('x')}Reject</button><button class="btn" data-openfile="${h.file==='Rest.php'?'Rest.php':''}">Open in editor</button></div>`}</div>`;
  }).join('');
  const done=pending()===0, anyOk=HUNKS.some(h=>decided[h.id]==='ok');
  return `<div class="review"><div class="rv-head"><div><h2>${ic('bot')}${a.task}</h2><p>${a.who} · <span class="mono">${a.branch}</span> · turn 3 · edits checkpointed in Local History</p></div>
    <div class="btns"><button class="btn" id="rvTest">${ic('flask')}Run tests in worktree</button><button class="btn agent" data-all="ok">${ic('check')}Accept all</button><button class="btn" data-all="no">Reject all</button></div></div>
    ${done?`<div class="merge">${ic('merge')}<span>${anyOk?`Review done. Merge <b class="mono">${a.branch}</b> into <b class="mono">feat/column-override</b>?`:'All changes rejected. The worktree can be discarded.'}</span><span style="flex:1"></span>${anyOk?'<button class="btn agent">Merge</button>':''}<button class="btn">Discard worktree</button></div>`:''}
    ${files}</div>`;
}

  const w=$('.edwrap').getBoundingClientRect(), r=el.getBoundingClientRect();
  card.hidden=false;
  card.style.left=Math.max(8,Math.min(r.left-w.left,w.width-card.offsetWidth-8))+'px'; card.style.top=(r.bottom-w.top+6)+'px';

function setScene(name){
  const s=SCENES[name]; Object.assign(state,{scene:name,L:s.L,R:s.R,B:s.B,tab:s.tab,debug:s.debug});
  if(matchMedia('(max-width: 900px)').matches){state.L=null;state.R=null}
  document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===name));
  $('#sceneNote').textContent=s.note; $('#agentPop').hidden=true; render();
}
function run(){
  if(state.running) return;
  state.running=true; state.B='run'; runShown=0; render();
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step=()=>{runShown++; renderBottom(); if(runShown<RUN_LINES.length) setTimeout(step,reduce?0:180); else {state.running=false; renderChrome();}};
  setTimeout(step,reduce?0:150);
}

document.addEventListener('click',e=>{

  const sc=t.closest('[data-scene]'); if(sc){setScene(sc.dataset.scene);return}
  const go=t.closest('[data-scene-go]'); if(go){setScene(go.dataset.sceneGo);return}
  const pb=t.closest('[data-panel]'); if(pb){const s=pb.dataset.side;state[s]=state[s]===pb.dataset.panel?null:pb.dataset.panel;$('#agentPop').hidden=true;render();return}
  const cl=t.closest('[data-close]'); if(cl){state[cl.dataset.close]=null;render();return}
  const ol=t.closest('[data-open-left]'); if(ol){state.L=ol.dataset.openLeft;render();return}
  const of=t.closest('[data-openfile]'); if(of&&of.dataset.openfile){const n=of.dataset.openfile;if(!state.open.includes(n))state.open.push(n);state.tab=n;render();return}
  const tb=t.closest('[data-tab]'); if(tb){state.tab=tb.dataset.tab;render();return}
  const bt=t.closest('[data-btab]'); if(bt){state.B=state.B===bt.dataset.btab&&bt.classList.contains('sb')?null:bt.dataset.btab;render();return}
  if(t.closest('[data-closebottom]')){state.B=null;render();return}
  const hk=t.closest('[data-hunk]'); if(hk){decided[hk.dataset.hunk]=hk.dataset.v;render();return}
  const un=t.closest('[data-undo]'); if(un){delete decided[un.dataset.undo];render();return}
  const all=t.closest('[data-all]'); if(all){HUNKS.forEach(h=>decided[h.id]=all.dataset.all);render();return}
  if(t.closest('#agentChip')){const p=$('#agentPop');p.hidden=!p.hidden;$('#agentChip').setAttribute('aria-expanded',!p.hidden);return}
  if(t.closest('#runBtn')||t.closest('[data-run]')||t.closest('#rvTest')){run();return}
  if(t.closest('#dbgBtn')){setScene('debug');return}
  if(t.closest('#stopBtn')||t.closest('#resume')){state.debug=false;state.running=false;if(state.B==='debug')state.B=null;render();return}
  if(t.closest('#openSearch')){openSE();return}
  if(!t.closest('#agentPop')) $('#agentPop').hidden=true;
});

/* ---------- search everywhere ---------- */
const SE=[
 ['Classes','Assets','LumenGallery\\Core','php'],['Classes','Rest','LumenGallery\\Core','php'],['Classes','AssetsTest','tests','php'],
 ['Files','phpcs.xml.dist','project root','phpcs'],['Files','composer.json','project root','composer'],
 ['Symbols','Assets::columns()','Assets.php:23','php'],['Hooks','lumen_gallery_columns','filter · 1 listener',null],['Hooks','wp_enqueue_scripts','action · 3 listeners',null],
 ['Actions','New Agent Task in Worktree','',null],['Actions','Show Local History','⌥⇧H',null],['Actions','Import Settings from PhpStorm','',null],
];
const SE_TABS=['All','Classes','Files','Symbols','Hooks','Actions'];
let seTab='All',seIdx=0,lastFocus=null;
function renderSE(){
  $('#seTabs').innerHTML=SE_TABS.map(t=>`<button role="tab" aria-selected="${t===seTab}" data-setab="${t}">${t}</button>`).join('');
  const q=$('#seInput').value.toLowerCase();
  const items=SE.filter(([k,n,d])=>(seTab==='All'||k===seTab)&&(k+' '+n+' '+d).toLowerCase().includes(q));
  seIdx=Math.min(seIdx,Math.max(0,items.length-1));
  $('#seList').innerHTML=items.length?items.map(([k,n,d,i],j)=>`<div class="se-item${j===seIdx?' on':''}" role="option" aria-selected="${j===seIdx}">${i?fi(i):ic(k==='Hooks'?'hook':'right')}<span class="grow"><b style="font-weight:500">${esc(n)}</b> <span class="mute">${esc(d)}</span></span><span class="kind">${k.replace(/s$/,'')}</span></div>`).join(''):`<div class="se-item mute">Nothing matches “${esc(q)}”.</div>`;
}
function openSE(){lastFocus=document.activeElement;$('#scrim').hidden=false;$('#seInput').value='';seIdx=0;renderSE();$('#seInput').focus()}
function closeSE(){$('#scrim').hidden=true;lastFocus&&lastFocus.focus&&lastFocus.focus()}
$('#seInput').addEventListener('input',()=>{seIdx=0;renderSE()});
$('#seTabs').addEventListener('click',e=>{const b=e.target.closest('[data-setab]');if(b){seTab=b.dataset.setab;renderSE();$('#seInput').focus()}});
$('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSE()});
let lastShift=0;
document.addEventListener('keydown',e=>{
  if(!$('#scrim').hidden){
    if(e.key==='Escape'){e.preventDefault();closeSE()}
    else if(e.key==='ArrowDown'){e.preventDefault();seIdx++;renderSE()}
    else if(e.key==='ArrowUp'){e.preventDefault();seIdx=Math.max(0,seIdx-1);renderSE()}
    else if(e.key==='Enter'){e.preventDefault();closeSE()}
    return;
  }
  if(e.key==='Escape'){$('#agentPop').hidden=true}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSE();return}
  if(e.key==='Shift'&&!e.repeat){const t=Date.now();if(t-lastShift<350){openSE();lastShift=0}else lastShift=t}
});

document.querySelectorAll('img[data-fi]').forEach(i=>i.src=AI[i.dataset.fi]);
setScene('edit');
</script>

name: Bug
description: Something in Zenith is broken
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes: { label: What happened vs expected }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Zenith version / upstream Zed commit }
